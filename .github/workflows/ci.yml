name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the run before it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# "shell: bash" runs steps with -eo pipefail (the default shell has no pipefail)
defaults:
  run:
    shell: bash

jobs:
  node-tests:
    name: Hub and channel tests
    # macOS: the hub renders pages with WebKit (tools/page-shot.swift) and images with sips
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Channel test (hub + channel, no Claude Code)
        run: node tools/test-channel.mjs
      - name: Hub test (no model calls)
        run: node tools/test-hub.mjs
        env:
          CHUMS_TEST_NO_MODEL: '1'
      - name: Artifacts test (every kind of file made into a picture, and the routes the iPhone opens them by)
        run: node tools/test-artifacts.mjs
      - name: Runtimes test (Codex, Copilot and ACP drivers against stand-ins; no model calls)
        run: node tools/test-runtimes.mjs

      - name: Standalone Hermes tool loop
        run: node tools/test-hermes.mjs
      - name: Native Hermes ACP contract
        run: node tools/test-hermes-native.mjs

  android-build:
    name: Android build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug assembleRelease lintDebug testDebugUnitTest
        working-directory: app/ChumsAndroid

  app-build:
    name: Watch and iPhone apps build (Simulator, unsigned)
    # the app targets watchOS 26, so it needs Xcode 26
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check the Xcode version
        run: |
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')" -ge 26 ] ||
            { echo "::error::The apps need Xcode 26 or later; select one with sudo xcode-select -s /Applications/Xcode_26.x.app"; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
      - name: Stand-in hub config (tools/gen-config.sh reads it)
        run: |
          mkdir -p ~/.chums
          echo '{"port": 7717, "publicPort": 7718, "token": "ci", "watchToken": "ci"}' > ~/.chums/config.json
      - name: Generate the project
        run: |
          tools/gen-config.sh
          cd app && CHUMS_BUNDLE=dev.chums.ci xcodegen generate
      - name: Build ChumsWatch for the Simulator
        # the whole log in a file; on a failure, the compiler's errors first (with the lines after them), then its end
        run: |
          cd app
          xcodebuild -project Chums.xcodeproj -target ChumsWatch -sdk watchsimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build/sym" build > build-watch.log 2>&1 ||
            { grep -A3 -E "error:" build-watch.log | head -120; tail -30 build-watch.log; exit 1; }
          tail -5 build-watch.log
      - name: Build the iPhone app, its widgets and the watch app inside it, for the Simulator
        # the scheme, not -target with -sdk: -sdk would build the embedded watch widget against the iOS SDK
        run: |
          cd app
          xcodebuild -project Chums.xcodeproj -scheme Chums -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath "$PWD/build/dd" CODE_SIGNING_ALLOWED=NO build > build-phone.log 2>&1 ||
            { grep -A3 -E "error:" build-phone.log | head -120; tail -30 build-phone.log; exit 1; }
          tail -5 build-phone.log
