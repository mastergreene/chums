name: Publish Android preview

on:
  push:
    branches: [feat/android-original-parity]
    paths: [.github/workflows/android-preview-release.yml]

permissions:
  contents: read

concurrency:
  group: android-preview-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
        working-directory: app/ChumsAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-release-apk
          path: app/ChumsAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-preview-release-apk
          path: preview
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'android-preview-0.1.0';
            const body = [
              'First Android preview for the existing Chums Mac hub, using Claude Code and Codex.',
              '',
              'Download **chums-android-preview.apk** under Assets and open it on an Android phone (Android 8 or later). No GitHub Actions artifact download is needed.',
              '',
              'Includes text and voice, agent selection, activity, approvals, result viewers, retained messages and optional background notifications.',
              '',
              'Requires the updated Mac hub from the feat/android-original-parity branch. Setup: https://github.com/mastergreene/chums/blob/feat/android-original-parity/docs/android.md',
              '',
              'This is a debug preview. Compilation, JVM unit tests and lint are checked automatically; real phone and agent acceptance testing remains outstanding. Hermes, Linux hub parity and wearables are deferred.',
              '',
              'Source commit: ' + context.sha
            ].join('\n');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'Chums Android Preview 0.1.0', body, draft: true, prerelease: true
              })).data;
            }
            if (!release.draft) {
              core.info('This immutable preview is already published: ' + release.html_url);
              return;
            }
            const apk = fs.readFileSync('preview/app-debug.apk');
            const checksum = crypto.createHash('sha256').update(apk).digest('hex') + '  chums-android-preview.apk\n';
            const existing = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id})).data;
            for (const [name, data, type] of [
              ['chums-android-preview.apk', apk, 'application/vnd.android.package-archive'],
              ['SHA256.txt', Buffer.from(checksum), 'text/plain']
            ]) {
              if (existing.some(asset => asset.name === name)) continue;
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: {'content-type': type, 'content-length': data.length}
              });
            }
            const published = await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, prerelease: true
            });
            core.info('Published: ' + published.data.html_url);
