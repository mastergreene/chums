name: Chums OG Android build and preview

on:
  push:
    branches: [ChumsOG-for-android]
    paths: [.github/workflows/android-og.yml, 'app/ChumsAndroid/**', 'tools/*characters*', 'tools/test-character-renderer.cjs', package.json, package-lock.json]

permissions:
  contents: read

concurrency:
  group: chumsog-android-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Original character asset conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil cmake ninja-build libde265-dev libpng-dev libjpeg-dev
          git clone --depth 1 --branch v1.23.2 https://github.com/strukturag/libheif.git "$RUNNER_TEMP/libheif"
          cmake -S "$RUNNER_TEMP/libheif" -B "$RUNNER_TEMP/libheif-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/heif" -DBUILD_TESTING=OFF -DBUILD_DOCUMENTATION=OFF -DWITH_GDK_PIXBUF=OFF -DWITH_EXAMPLE_HEIF_VIEW=OFF -DWITH_X265=OFF -DWITH_X264=OFF -DWITH_OpenH264_DECODER=OFF -DWITH_AOM_DECODER=OFF -DWITH_AOM_ENCODER=OFF -DWITH_LIBSHARPYUV=OFF -DENABLE_PLUGIN_LOADING=OFF
          cmake --build "$RUNNER_TEMP/libheif-build" --parallel 2
          cmake --install "$RUNNER_TEMP/libheif-build"
          echo "$RUNNER_TEMP/heif/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/heif/lib:$RUNNER_TEMP/heif/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
        working-directory: app/ChumsAndroid
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:characters
      - uses: actions/upload-artifact@v4
        with:
          name: character-state-snapshots
          path: app/ChumsAndroid/app/build/reports/characters
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: chumsog-preview-apk
          path: app/ChumsAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chumsog-preview-apk
          path: preview
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'chumsog-android-preview-0.2.0';
            const body = [
              'Android port starting from the original lcoutodemos/chums source, with the original Mac hub and eight original characters.',
              '',
              'Download **chumsog-android-preview.apk** under Assets and open it on an Android phone (Android 8 or later). No GitHub Actions artifact download is needed.',
              '',
              'Replaces promotional loops with live local renderers and original state-specific clips. Includes original Pix renderer for Crunch/Nana, original Ray outlines, Noodle shape journeys, 76 Stretch clips, and state-driven eyes/yarn faces. Adds touch reactions, stale activity fixes, recording cancellation and sandboxed live HTML resources. Full simulation/rendering parity and device QA remain unfinished.',
              '',
              'Uses the unchanged original Mac hub from the ChumsOG-for-android branch. Setup: https://github.com/mastergreene/chums/blob/ChumsOG-for-android/docs/android-og.md',
              '',
              'This is a debug preview. Compilation, JVM unit tests and lint are checked automatically; real phone and agent acceptance testing remains outstanding. Garfield and Hermes are outside this branch. Live device validation and exact Swift simulation parity remain unfinished.',
              '',
              'Source commit: ' + context.sha
            ].join('\n');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'ChumsOG Android Preview 0.2.0', body, draft: true, prerelease: true
              })).data;
            }
            if (!release.draft) {
              core.info('This immutable preview is already published: ' + release.html_url);
              return;
            }
            const apk = fs.readFileSync('preview/app-debug.apk');
            const checksum = crypto.createHash('sha256').update(apk).digest('hex') + '  chumsog-android-preview.apk\n';
            const existing = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id})).data;
            for (const [name, data, type] of [
              ['chumsog-android-preview.apk', apk, 'application/vnd.android.package-archive'],
              ['SHA256.txt', Buffer.from(checksum), 'text/plain']
            ]) {
              if (existing.some(asset => asset.name === name)) continue;
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: {'content-type': type, 'content-length': data.length}
              });
            }
            const published = await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, prerelease: true
            });
            core.info('Published: ' + published.data.html_url);
